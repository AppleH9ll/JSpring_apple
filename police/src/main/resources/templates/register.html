<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | Отделение полиции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/police.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-shield-alt"></i>
            <h1>Регистрация</h1>
            <p>Создание личного кабинета гражданина</p>
        </div>
        <div th:if="${message}" class="alert alert-error" th:text="${message}"></div>
        <form th:action="@{/registration}" method="post">
            <div class="form-group">
                <label>Логин *</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Пароль *</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Фамилия</label><input type="text" name="lastName"></div>
                <div class="form-group"><label>Имя</label><input type="text" name="firstName"></div>
            </div>
            <div class="form-group">
                <label>Телефон</label>
                <input type="tel" name="phone" placeholder="+7 (___) ___-__-__">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
        </form>
        <div class="auth-links">
            <a th:href="@{/login}">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>
</body>
</html>
