<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отделения | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/police.css}">
</head>
<body>
<div th:replace="~{blocks/header :: header}"></div>
<section class="page-section">
    <div class="container">
        <h2 class="section-title">Отделения полиции</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="form-container">
            <h3>Добавить отделение</h3>
            <form th:action="@{/admin/departments/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Название *</label>
                        <input type="text" name="name" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label>Адрес *</label>
                        <input type="text" name="address" required maxlength="255">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="text" name="phone" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" maxlength="100">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Добавить</button>
            </form>
        </div>

        <div class="appeals-table-wrapper" style="margin-top:30px;">
            <table class="appeals-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Адрес</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${departments}">
                    <td th:text="${d.idDepartment}"></td>
                    <td><strong th:text="${d.name}"></strong></td>
                    <td th:text="${d.address}"></td>
                    <td th:text="${d.phone}"></td>
                    <td th:text="${d.email}"></td>
                    <td>
                        <form th:action="@{/admin/departments/delete}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${d.idDepartment}">
                            <button type="submit" class="btn btn-primary"
                                    style="background:#c41230;"
                                    onclick="return confirm('Удалить отделение?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td colspan="6" class="empty-row">Отделений нет</td>
                </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/admin/dashboard}" class="btn btn-secondary" style="margin-top:20px;">
            ← Назад в админ-панель
        </a>
    </div>
</section>
</body>
</html>
