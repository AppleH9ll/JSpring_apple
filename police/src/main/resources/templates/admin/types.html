<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Типы обращений | Админ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/police.css}">
</head>
<body>
<div th:replace="~{blocks/header :: header}"></div>
<section class="page-section">
    <div class="container">
        <h2 class="section-title">Типы обращений</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="form-container">
            <h3>Добавить тип</h3>
            <form th:action="@{/admin/types/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Название *</label>
                        <input type="text" name="name" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <input type="text" name="description" maxlength="500">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Добавить</button>
            </form>
        </div>

        <div class="appeals-table-wrapper" style="margin-top:30px;">
            <table class="appeals-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${types}">
                    <td th:text="${t.idType}"></td>
                    <td><strong th:text="${t.name}"></strong></td>
                    <td th:text="${t.description}"></td>
                    <td>
                        <form th:action="@{/admin/types/delete}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${t.idType}">
                            <button type="submit" class="btn btn-primary"
                                    style="background:#c41230;"
                                    onclick="return confirm('Удалить тип?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(types)}">
                    <td colspan="4" class="empty-row">Типов нет</td>
                </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/admin/dashboard}" class="btn btn-secondary" style="margin-top:20px;">
            ← Назад в админ-панель
        </a>
    </div>
</section>
</body>
</html>
